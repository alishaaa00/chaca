<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tulipPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EAA" />
      <stop offset="50%" stop-color="#FF7488" />
      <stop offset="100%" stop-color="#E5566E" />
    </linearGradient>
    <linearGradient id="tulipPeachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD1BA" />
      <stop offset="60%" stop-color="#FFAAA6" />
      <stop offset="100%" stop-color="#FF8C94" />
    </linearGradient>
    <linearGradient id="tulipYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="60%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFCA28" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7E4C7" />
      <stop offset="50%" stop-color="#74C69D" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>
    <linearGradient id="softGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFE5EC" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#E5989B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background decorative circle -->
  <circle cx="250" cy="250" r="210" fill="url(#softGlow)" />
  <circle cx="250" cy="250" r="200" fill="none" stroke="#FFCCD5" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Floating Sparkles -->
  <g fill="#FFB703" opacity="0.85">
    <path d="M 120 130 Q 120 145 105 145 Q 120 145 120 160 Q 120 145 135 145 Q 120 145 120 130 Z" />
    <path d="M 380 110 Q 380 120 370 120 Q 380 120 380 130 Q 380 120 390 120 Q 380 120 380 110 Z" />
    <path d="M 400 320 Q 400 332 388 332 Q 400 332 400 344 Q 400 332 412 332 Q 400 332 400 320 Z" />
    <circle cx="140" cy="340" r="4" fill="#FFB4A2" />
    <circle cx="360" cy="220" r="3.5" fill="#FFB4A2" />
    <circle cx="110" cy="230" r="3" fill="#FFCDB2" />
  </g>

  <!-- Left Tulip Stem & Leaf -->
  <path d="M 170 380 Q 185 290 195 210" fill="none" stroke="url(#leafGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 185 300 Q 120 260 140 200 Q 170 240 188 270 Z" fill="url(#leafGrad)" opacity="0.9" filter="url(#softShadow)" />

  <!-- Right Tulip Stem & Leaf -->
  <path d="M 320 380 Q 305 280 295 200" fill="none" stroke="url(#leafGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 305 290 Q 375 250 355 190 Q 325 230 302 265 Z" fill="url(#leafGrad)" opacity="0.9" filter="url(#softShadow)" />

  <!-- Center Tulip Stem -->
  <path d="M 250 400 Q 248 290 250 170" fill="none" stroke="url(#leafGrad)" stroke-width="9" stroke-linecap="round" />
  <path d="M 248 310 Q 210 240 230 180 Q 245 220 249 265 Z" fill="url(#leafGrad)" opacity="0.95" />
  <path d="M 252 320 Q 290 250 270 190 Q 255 230 251 275 Z" fill="url(#leafGrad)" opacity="0.95" />

  <!-- Left Tulip Flower (Peach/Coral) -->
  <g transform="translate(140, 130) rotate(-12)" filter="url(#softShadow)">
    <!-- Back Petal -->
    <path d="M 50 15 C 30 15 15 45 25 75 C 35 95 65 95 75 75 C 85 45 70 15 50 15 Z" fill="#E56B6F" />
    <!-- Left Petal -->
    <path d="M 50 85 C 20 85 5 55 15 30 C 25 10 45 35 48 85 Z" fill="url(#tulipPeachGrad)" />
    <!-- Right Petal -->
    <path d="M 50 85 C 80 85 95 55 85 30 C 75 10 55 35 52 85 Z" fill="url(#tulipPeachGrad)" />
    <!-- Center Front Petal -->
    <path d="M 50 88 C 30 88 28 42 42 22 C 48 14 52 14 58 22 C 72 42 70 88 50 88 Z" fill="#FFAAA6" />
    <!-- Highlight -->
    <path d="M 46 30 Q 50 25 54 30 Q 52 60 48 75 Z" fill="#FFF0F3" opacity="0.5" />
  </g>

  <!-- Right Tulip Flower (Yellow/Warm Sunshine) -->
  <g transform="translate(260, 120) rotate(14)" filter="url(#softShadow)">
    <!-- Back Petal -->
    <path d="M 50 15 C 30 15 15 45 25 75 C 35 95 65 95 75 75 C 85 45 70 15 50 15 Z" fill="#F4A261" />
    <!-- Left Petal -->
    <path d="M 50 85 C 20 85 5 55 15 30 C 25 10 45 35 48 85 Z" fill="url(#tulipYellowGrad)" />
    <!-- Right Petal -->
    <path d="M 50 85 C 80 85 95 55 85 30 C 75 10 55 35 52 85 Z" fill="url(#tulipYellowGrad)" />
    <!-- Center Front Petal -->
    <path d="M 50 88 C 30 88 28 42 42 22 C 48 14 52 14 58 22 C 72 42 70 88 50 88 Z" fill="#FFE082" />
    <!-- Highlight -->
    <path d="M 46 30 Q 50 25 54 30 Q 52 60 48 75 Z" fill="#FFFDE7" opacity="0.7" />
  </g>

  <!-- Center Tulip Flower (Signature Pastel Rose Pink) -->
  <g transform="translate(195, 75)" filter="url(#softShadow)">
    <!-- Back Petal -->
    <path d="M 55 15 C 32 15 15 50 26 85 C 38 108 72 108 84 85 C 95 50 78 15 55 15 Z" fill="#D63384" />
    <!-- Left Petal -->
    <path d="M 55 98 C 20 98 4 62 16 34 C 27 12 50 40 53 98 Z" fill="url(#tulipPinkGrad)" />
    <!-- Right Petal -->
    <path d="M 55 98 C 90 98 106 62 94 34 C 83 12 60 40 57 98 Z" fill="url(#tulipPinkGrad)" />
    <!-- Center Front Petal -->
    <path d="M 55 100 C 33 100 30 48 46 25 C 52 16 58 16 64 25 C 80 48 77 100 55 100 Z" fill="#FF9EAA" />
    <!-- Cute Highlight & Detail -->
    <path d="M 50 32 Q 55 26 60 32 Q 57 68 53 85 Z" fill="#FFF5F7" opacity="0.6" />
    <circle cx="55" cy="55" r="2" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Sweet Pastel Ribbon at the Bouquet Base -->
  <g transform="translate(210, 360)" filter="url(#softShadow)">
    <path d="M 40 25 C 10 10 5 45 35 30 Z" fill="#FF8FA3" />
    <path d="M 40 25 C 70 10 75 45 45 30 Z" fill="#FF8FA3" />
    <circle cx="40" cy="27" r="8" fill="#FF4D6D" />
    <!-- Ribbon tails -->
    <path d="M 37 32 Q 25 55 18 70 Q 28 65 35 50 Z" fill="#FF758F" />
    <path d="M 43 32 Q 55 55 62 70 Q 52 65 45 50 Z" fill="#FF758F" />
  </g>

  <!-- Little Falling Petals -->
  <g fill="#FFB7C5" opacity="0.85">
    <path d="M 100 370 C 90 360 85 375 95 385 C 105 395 115 380 100 370 Z" />
    <path d="M 390 270 C 400 260 410 270 405 285 C 400 295 385 280 390 270 Z" />
  </g>
</svg>
