<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EAA"/>
      <stop offset="100%" stop-color="#FF758F"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE5EC"/>
    </linearGradient>
    <filter id="softGlowBook">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#E07A5F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Soft pastel backdrop circle -->
  <circle cx="250" cy="225" r="190" fill="#FFF0F3" />
  <circle cx="250" cy="225" r="180" fill="none" stroke="#FFCCD5" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Cozy Open Novel Book -->
  <g transform="translate(100, 160)" filter="url(#softGlowBook)">
    <!-- Book cover back edges -->
    <path d="M 15 135 Q 150 150 150 155 Q 150 150 285 135 L 290 145 Q 150 160 150 165 Q 150 160 10 145 Z" fill="#E56B6F" />
    
    <!-- Left pages block -->
    <path d="M 20 130 C 50 115 110 120 150 135 L 150 35 C 110 20 50 15 20 30 Z" fill="#FFFDF8" stroke="#E6CCB2" stroke-width="1.5" />
    <path d="M 23 126 C 53 112 110 117 150 132 L 150 32 C 110 17 53 12 23 27 Z" fill="#FFFFFF" stroke="#E6CCB2" stroke-width="1" />
    
    <!-- Right pages block -->
    <path d="M 280 130 C 250 115 190 120 150 135 L 150 35 C 190 20 250 15 280 30 Z" fill="#FFFDF8" stroke="#E6CCB2" stroke-width="1.5" />
    <path d="M 277 126 C 247 112 190 117 150 132 L 150 32 C 190 17 247 12 277 27 Z" fill="#FFFFFF" stroke="#E6CCB2" stroke-width="1" />

    <!-- Cute text lines simulation in novel -->
    <g stroke="#CDB4DB" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <!-- Left Page -->
      <line x1="40" y1="45" x2="130" y2="48" />
      <line x1="40" y1="60" x2="130" y2="63" />
      <line x1="40" y1="75" x2="120" y2="78" />
      <line x1="40" y1="90" x2="130" y2="93" />
      <line x1="40" y1="105" x2="95" y2="107" />
      
      <!-- Right Page -->
      <line x1="170" y1="48" x2="260" y2="45" />
      <line x1="170" y1="63" x2="260" y2="60" />
      <line x1="170" y1="78" x2="245" y2="75" />
      <line x1="170" y1="93" x2="260" y2="90" />
      <line x1="170" y1="107" x2="210" y2="105" />
    </g>

    <!-- Tulip Ribbon Bookmark hanging down -->
    <path d="M 150 35 Q 152 140 160 175 Q 150 170 142 178 Q 148 140 150 35" fill="#FF758F" />
    <!-- Little tulip charm at the end of bookmark -->
    <circle cx="152" cy="183" r="5" fill="#FF4D6D" />
  </g>

  <!-- Cup of Warm Latte / Tea with Heart Foam -->
  <g transform="translate(325, 90)" filter="url(#softGlowBook)">
    <!-- Saucer -->
    <ellipse cx="60" cy="95" rx="36" ry="10" fill="#FFE5EC" stroke="#FFB7C5" stroke-width="2" />
    <!-- Cup body -->
    <path d="M 35 60 C 35 90 85 90 85 60 Z" fill="url(#cupGrad)" stroke="#FFB7C5" stroke-width="2" />
    <!-- Handle -->
    <path d="M 83 65 C 96 65 96 82 82 82" fill="none" stroke="#FFB7C5" stroke-width="3" stroke-linecap="round" />
    <!-- Foam & Heart Latte Art -->
    <ellipse cx="60" cy="60" rx="25" ry="8" fill="#FCEADE" stroke="#DDA15E" stroke-width="1.5" />
    <path d="M 60 58 C 55 54 53 62 60 66 C 67 62 65 54 60 58 Z" fill="#BC6C25" opacity="0.85" />
    <!-- Steam with cute sparkle -->
    <path d="M 52 48 Q 50 38 56 30" fill="none" stroke="#FFAAA6" stroke-width="2" stroke-linecap="round" />
    <path d="M 66 45 Q 68 35 62 27" fill="none" stroke="#FFAAA6" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Reading Glasses -->
  <g transform="translate(90, 105)" stroke="#6C757D" stroke-width="2.5" fill="rgba(255,255,255,0.7)">
    <circle cx="45" cy="40" r="18" />
    <circle cx="95" cy="40" r="18" />
    <path d="M 63 38 Q 70 34 77 38" fill="none" />
    <line x1="27" y1="38" x2="10" y2="30" stroke-linecap="round" />
    <line x1="113" y1="38" x2="130" y2="30" stroke-linecap="round" />
  </g>

  <!-- Delicate Floral Twigs / Dried Tulips around the book -->
  <g stroke="#74C69D" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 80 340 Q 110 320 135 345" />
    <circle cx="140" cy="347" r="4" fill="#FFB7C5" stroke="none" />
    <circle cx="120" cy="326" r="3" fill="#FFAAA6" stroke="none" />
  </g>

  <!-- Sparkles -->
  <g fill="#FFB703" opacity="0.85">
    <path d="M 250 70 Q 250 80 240 80 Q 250 80 250 90 Q 250 80 260 80 Q 250 80 250 70 Z" />
    <path d="M 390 280 Q 390 290 382 290 Q 390 290 390 298 Q 390 290 398 290 Q 390 290 390 280 Z" />
    <circle cx="110" cy="80" r="3" fill="#FFCDB2" />
  </g>
</svg>
